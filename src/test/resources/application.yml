server:
  port: 8080
  servlet:
    context-path: /api

spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: test
  application:
    name: springboot-app-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=YEAR,MONTH,DAY,HOUR,MINUTE,SECOND
    username: sa
    password:
    driver-class-name: org.h2.Driver
    schema: classpath:sql/schema-test.sql
    data: classpath:sql/data-test.sql
    sql-script-encoding: UTF-8
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 1
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 0
  session:
    store-type: none
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-test.sql
      data-locations: classpath:sql/data-test.sql
      encoding: UTF-8

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    print-banner: false

logging:
  level:
    com.example.springboot: warn
    org.springframework: warn
    org.mybatis: warn

minio:
  endpoint: http://localhost:9000
  accessKey: test
  secretKey: test12345
  bucketName: test-bucket

session:
  token-expiration: 7200
  refresh-token-expiration: 604800

knife4j:
  enable: false