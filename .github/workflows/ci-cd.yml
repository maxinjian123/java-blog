name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Dmaven.wagon.http.retryHandler.count=3'

jobs:
  test-and-build:
    name: 测试与构建
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven 验证与编译
        run: mvn -B validate compile

      - name: 运行单元测试
        run: mvn -B test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Maven 打包 (跳过测试)
        if: success()
        run: mvn -B clean package -DskipTests

      - name: 上传构建产物 JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 14

  docker-build-and-push:
    name: Docker 构建与推送
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 下载构建产物 JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target/

      - name: 确认 JAR 文件存在
        run: ls -la target/*.jar

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy-staging:
    name: 部署到 Staging 环境
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
    steps:
      - name: 部署到 Staging 服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          password: ${{ secrets.STAGING_SSH_PASSWORD }}
          passphrase: ${{ secrets.STAGING_SSH_PASSPHRASE }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          script: |
            cd ~/app/staging || mkdir -p ~/app/staging && cd ~/app/staging
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            REPO_FULL=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            printf '%b' 'version: "3.8"\nservices:\n  mysql:\n    image: mysql:8.0\n    container_name: staging-mysql\n    restart: unless-stopped\n    environment:\n      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}\n      MYSQL_DATABASE: personal_blog\n      TZ: Asia/Shanghai\n    ports:\n      - "13306:3306"\n    volumes:\n      - mysql-data:/var/lib/mysql\n    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci\n    networks:\n      - blog-net\n  redis:\n    image: redis:7-alpine\n    container_name: staging-redis\n    restart: unless-stopped\n    ports:\n      - "16379:6379"\n    volumes:\n      - redis-data:/data\n    command: redis-server --appendonly yes\n    networks:\n      - blog-net\n  app:\n    image: ghcr.io/'"${REPO_FULL}"':develop\n    container_name: staging-app\n    restart: unless-stopped\n    ports:\n      - "8081:8080"\n    pull_policy: always\n    environment:\n      SPRING_PROFILES_ACTIVE: prod\n      DB_USERNAME: root\n      DB_PASSWORD: ${DB_PASSWORD}\n      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/personal_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true\n      SPRING_DATA_REDIS_HOST: redis\n      SPRING_DATA_REDIS_PORT: 6379\n      SPRING_DATA_REDIS_PASSWORD: ""\n      JAVA_OPTS: -Xms256m -Xmx1024m\n      TZ: Asia/Shanghai\n    depends_on:\n      - mysql\n      - redis\n    networks:\n      - blog-net\nvolumes:\n  mysql-data:\n  redis-data:\nnetworks:\n  blog-net:\n    driver: bridge\n' > docker-compose.yml

            DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }} docker-compose config -q > /dev/null 2>&1 || { echo "❌ docker-compose.yml 语法错误，内容如下："; cat docker-compose.yml; exit 1; }
            DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }} docker-compose pull app
            DB_PASSWORD=${{ secrets.STAGING_DB_PASSWORD }} docker-compose up -d

            RETRY=0; MAX_RETRY=30
            while [ $RETRY -lt $MAX_RETRY ]; do
              if curl -sf http://localhost:8081/api/health > /dev/null 2>&1; then
                echo "✅ Staging 部署成功"
                break
              fi
              RETRY=$((RETRY + 1)); sleep 3
              echo "等待中... ($RETRY/$MAX_RETRY)"
            done
            [ $RETRY -ge $MAX_RETRY ] && { echo "❌ 超时"; docker-compose logs --tail=50 app; exit 1; }
            docker image prune -f

  deploy-production:
    name: 部署到 Production 环境
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
    steps:
      - name: 部署到 Production 服务器
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          passphrase: ${{ secrets.PROD_SSH_PASSPHRASE }}
          port: ${{ secrets.PROD_PORT || 22 }}
          timeout: 30s
          command_timeout: 15m
          script_stop: true
          script: |
            cd ~/app/production || mkdir -p ~/app/production && cd ~/app/production
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            REPO_FULL=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
            printf '%b' 'version: "3.8"\nservices:\n  mysql:\n    image: mysql:8.0\n    container_name: blog-mysql\n    restart: unless-stopped\n    environment:\n      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}\n      MYSQL_DATABASE: personal_blog\n      TZ: Asia/Shanghai\n    ports:\n      - "3306:3306"\n    volumes:\n      - mysql-data:/var/lib/mysql\n    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci\n    networks:\n      - blog-net\n  redis:\n    image: redis:7-alpine\n    container_name: blog-redis\n    restart: unless-stopped\n    ports:\n      - "6379:6379"\n    volumes:\n      - redis-data:/data\n    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}\n    networks:\n      - blog-net\n  app:\n    image: ghcr.io/'"${REPO_FULL}"':latest\n    container_name: java-blog\n    restart: unless-stopped\n    ports:\n      - "8080:8080"\n    pull_policy: always\n    environment:\n      SPRING_PROFILES_ACTIVE: prod\n      DB_USERNAME: root\n      DB_PASSWORD: ${DB_PASSWORD}\n      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/personal_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true\n      SPRING_DATA_REDIS_HOST: redis\n      SPRING_DATA_REDIS_PORT: 6379\n      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}\n      JAVA_OPTS: -Xms512m -Xmx2048m -XX:+UseG1GC -XX:MaxGCPauseMillis=200\n      TZ: Asia/Shanghai\n    depends_on:\n      - mysql\n      - redis\n    logging:\n      driver: json-file\n      options:\n        max-size: "100m"\n        max-file: "5"\n    networks:\n      - blog-net\nvolumes:\n  mysql-data:\n  redis-data:\nnetworks:\n  blog-net:\n    driver: bridge\n' > docker-compose.yml

            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }} docker-compose config -q > /dev/null 2>&1 || { echo "❌ docker-compose.yml 语法错误，内容如下："; cat docker-compose.yml; exit 1; }

            echo "💾 部署前数据库备份..."
            mkdir -p ~/app/backups
            BACKUP_FILE=~/app/backups/db-backup-$(date +%Y%m%d%H%M%S).sql
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} docker-compose exec -T mysql \
              sh -c 'mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" personal_blog' > "$BACKUP_FILE" 2>/dev/null || true
            [ -s "$BACKUP_FILE" ] && echo "   备份完成: $BACKUP_FILE" || echo "   备份跳过(首次部署)"

            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }} docker-compose pull app
            DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} REDIS_PASSWORD=${{ secrets.PROD_REDIS_PASSWORD }} docker-compose up -d --no-deps app

            RETRY=0; MAX_RETRY=30
            while [ $RETRY -lt $MAX_RETRY ]; do
              if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
                echo "✅ Production 部署成功"
                echo "   API 文档: ${{ secrets.PRODUCTION_URL }}/api/doc.html"
                break
              fi
              RETRY=$((RETRY + 1)); sleep 3
              echo "等待中... ($RETRY/$MAX_RETRY)"
            done
            [ $RETRY -ge $MAX_RETRY ] && { echo "❌ 超时"; docker-compose logs --tail=100 app; exit 1; }
            docker image prune -f; docker container prune -f